services:
  wikipedia-service:
    build:
      context: ./spring-boot-weflux-consumer
    container_name: wikipedia-service
    stop_grace_period: 35s
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  wikipedia-mvc-service:
    build:
      context: ./spring-boot-mvc-streaming-consumer
    container_name: wikipedia-mvc-service
    stop_grace_period: 35s
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  streaming-html-client:
    build:
      context: ./streaming-html-client
    container_name: streaming-html-client
    depends_on:
      wikipedia-service:
        condition: service_healthy
      wikipedia-mvc-service:
        condition: service_healthy
    ports:
      - "8081:80"
