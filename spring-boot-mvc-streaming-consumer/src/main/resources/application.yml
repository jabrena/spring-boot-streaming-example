server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: spring-boot-mvc-streaming-consumer
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

wikimedia:
  recent-change-url: https://stream.wikimedia.org/v2/stream/recentchange

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
