server:
  port: 8080

spring:
  application:
    name: spring-boot-weflux-consumer

wikimedia:
  base-url: https://stream.wikimedia.org
  recent-change-path: /v2/stream/recentchange

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
