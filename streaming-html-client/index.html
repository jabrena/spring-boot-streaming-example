<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wikipedia Recent Changes Stream</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Wikipedia Recent Changes</h1>
      <p class="subtitle">Live events streamed from the Spring Boot WebFlux service.</p>
    </div>
    <div id="status" class="status">
      <span class="status-dot"></span>
      <span id="statusText">Disconnected</span>
    </div>
  </header>

  <section class="toolbar" aria-label="Stream controls">
    <label>
      Wiki
      <input id="wiki" type="text" placeholder="enwiki">
    </label>
    <label>
      Limit
      <input id="limit" type="number" min="1" max="100" value="20">
    </label>
    <label class="checkbox">
      <input id="includeBots" type="checkbox">
      Include bots
    </label>
    <div>
      <button id="connect">Connect</button>
      <button id="disconnect" class="secondary" disabled>Disconnect</button>
    </div>
  </section>

  <section id="events" class="events">
    <div class="empty">Connect to start receiving events.</div>
  </section>
</main>
</body>
</html>
